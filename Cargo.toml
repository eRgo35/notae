[workspace]
resolver = "3"
# Each member is listed explicitly so a `cargo metadata` reader (and
# `git grep 'apps/'`) sees exactly what the workspace pulls in. Adding
# a new app means adding a line below.
members = [
    "crates/notae-domain",
    "crates/notae-index",
    "crates/notae-ocr",
    "apps/notae-index",
    "apps/notae-android",
]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"