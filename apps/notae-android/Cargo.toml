[package]
name = "notae-android"
description = "Slint + android-activity UI for the Notae portable sidecar."
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

# Both crate types are produced together:
#   * `cdylib` so `cargo-apk2` can bundle `libnotae_android.so` as the
#     `android.app.lib_name` payload for `NotaeActivity`.
#   * `rlib` so `cargo test` on Linux can link the host-side smoke test
#     against the same state machine that runs on device.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slint = { version = "1.18", features = ["backend-android-activity-06"] }
thiserror = { workspace = true }
notae-domain = { path = "../../crates/notae-domain", version = "0.2.1" }
notae-index = { path = "../../crates/notae-index", version = "0.2.1" }
sha2 = "0.10"
# `atomic-waker` is the standard library the SAF picker handshake
# uses to bridge the Slint main thread (where `select_root` is
# polled) and the Java main looper (where the activity-result
# callback fires). The `AtomicWaker::register` / `wake` pair is
# the canonical idiom: the producer registers its `Waker` before
# the consumer wakes it, so nothing is lost across the platform
# callback's thread boundary.
atomic-waker = "1"
# Slint's Android backend publishes no accessibility tree, so `accessibility.rs` walks the
# item tree itself through i-slint-core's accessibility API (the calls the desktop AccessKit
# adapter uses). Same crate and version `slint` already resolves, so no new package; the
# exact pin matches the pinned Slint stack because this API is not semver-stable. Host tests
# also use it to build the `InternalKeyEvent` composition events the Android backend
# dispatches.
i-slint-core = "=1.18.1"

# `notae-index-cli` is the Linux indexer binary crate. It pulls in C/C++
# deps (hayro, image, Tesseract via `notae-ocr`) that don't cross-compile,
# so it is wired in only when the target is *not* Android. On host builds
# we re-use its `FilesystemCatalog` as the host-side `PdfCatalog` for the
# storage-state tests; on Android the SAF adapter in
# `src/android/saf.rs` plays the same role.
[target.'cfg(not(target_os = "android"))'.dependencies]
notae-index-cli = { path = "../notae-index", version = "0.2.1" }

# `jni` and `android-activity` are direct deps only on Android.
# `android-activity` is the runtime the `android_main` FFI shim already
# pulls in transitively; we list it explicitly so `saf.rs` can use the
# `AndroidApp` type directly. `jni` is what `saf.rs` uses for the
# `ContentResolver` and `SharedPreferences` calls the high-level
# `android-activity` API does not (yet) cover.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6"
jni = "0.22"

# `notae-ocr` remains host/Linux-only: its current Tesseract and Leptonica
# bindings do not support Android cross-compilation. Android uses PdfRenderer
# for text-layer extraction only; image-only PDFs remain OCR-pending. PDFs
# are rendered only to first-page thumbnails.
# Cross-compiling `notae-index` to Android is non-trivial because it bundles
# SQLite via `cc-rs`. The build expects the NDK clang in the PATH for
# `aarch64-linux-android`; `cargo apk2` sets that up. The host test
# links only the trait types — see `apps/notae-android/tests/storage_state.rs`.

[build-dependencies]
# `slint-build` parses the .slint file at build time, emits a Rust module
# into $OUT_DIR, and is compiled into the lib on every target — Android
# included — without dragging in the heavy renderer at test time.
slint-build = "1.18"

[dev-dependencies]
# `tempfile` is what the host tests build a temporary library root out of.
tempfile = "3"
pollster = "1.0"
i-slint-backend-testing = "=1.18.1"
# `cargo-apk2` compiles the Java result adapter and generates the
# launcher manifest from the metadata below.
[package.metadata.android]
build_targets = ["aarch64-linux-android"]
package = "org.notae.android"
apk_name = "notae-android"
java_sources = "android/src/main/java"
resources = "android/res"
use_aapt2 = true

[[package.metadata.android.queries.package]]
name = "com.samsung.android.app.notes"

[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.VIEW"]

[[package.metadata.android.queries.intent.data]]
mime_type = "application/pdf"

[[package.metadata.android.queries.intent]]
actions = ["android.speech.action.RECOGNIZE_SPEECH"]

[package.metadata.android.application]
label = "Notae"
has_code = true
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = ".NotaeActivity"
config_changes = "orientation|keyboard|keyboardHidden|screenSize|screenLayout|smallestScreenSize"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "notae_android"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

# The target SDK stays within the NDK r26d API range.

[package.metadata.android.sdk]
min_sdk_version = 23
# NDK r26d supports API 21-34. Until a newer NDK lands, target API 34,
# which is also the latest API the installed NDK can compile against.
target_sdk_version = 34

# Release signing is deliberately not configured here. `cargo apk2 build --release` takes the
# key from CARGO_APK_RELEASE_KEYSTORE and CARGO_APK_RELEASE_KEYSTORE_PASSWORD and fails without
# them; see docs/android-release.md. Debug builds use the SDK's debug keystore.

# The Android crate is the one place in the workspace that has to expose
# an `extern "C"` symbol — `android_main` — to the
# `android-activity` runtime. The `#[unsafe(no_mangle)]` attribute is
# what surfaces the symbol in the produced `libnotae_android.so`. Rust's
# `unsafe_code` lint flags every `unsafe` attribute, including harmless
# ones, so the workspace's `forbid` level would override any local
# `#[allow(...)]` and break the build.
#
# We drop the level from `forbid` to `deny` here so the FFI shim can
# use `#[allow(unsafe_code)]` locally, and the host-testable core
# (`state.rs`, `ui.rs`) keeps a strict `#![forbid(unsafe_code)]` of its
# own. Everywhere else in the workspace, `forbid` remains in force.
[lints.rust]
unsafe_code = "deny"
