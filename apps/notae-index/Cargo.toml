[package]
name = "notae-index-cli"
description = "Linux-only CLI that indexes a folder of PDFs into a portable Notae sidecar."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "notae_index_cli"
path = "src/lib.rs"

[[bin]]
name = "notae-index"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
hayro = "0.8"
image = "0.25"
notae-domain = { path = "../../crates/notae-domain", version = "0.1" }
notae-index = { path = "../../crates/notae-index", version = "0.1" }
notae-ocr = { path = "../../crates/notae-ocr", version = "0.1" }
sha2 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true