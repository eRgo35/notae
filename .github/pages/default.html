<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.url == "/" %}Notae: sheet-music library for Android{% else %}{{ page.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="/docs/images/notae-icon.png">
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0;
      --code-bg: #f6f8fa; --link: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d;
        --code-bg: #151b23; --link: #4493f8;
      }
    }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
    main, nav, footer { max-width: 56rem; margin: 0 auto; padding: 0 16px; }
    nav { padding-top: 16px; }
    main { padding-top: 16px; padding-bottom: 32px; }
    footer { padding-bottom: 32px; color: var(--muted); font-size: 14px; }
    footer p { border-top: 1px solid var(--line); padding-top: 16px; }
    a { color: var(--link); }
    h1, h2 { border-bottom: 1px solid var(--line); padding-bottom: .3em; line-height: 1.25; }
    h2 { margin-top: 2em; }
    img { max-width: 100%; height: auto; }
    code, pre { font: 85% ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); border-radius: 6px; }
    code { padding: .2em .4em; }
    pre { padding: 16px; overflow-x: auto; line-height: 1.45; }
    pre code { padding: 0; font-size: 100%; background: none; }
    blockquote { margin: 1em 0; padding: 0 1em; border-left: 4px solid var(--line); }
    table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; }
    td, th { border: 1px solid var(--line); padding: 6px 13px; vertical-align: top; }
    details { margin: 1em 0; }
    summary { cursor: pointer; }
  </style>
</head>
<body>
  {% if page.url != "/" %}<nav><a href="/">Notae</a></nav>{% endif %}
  <main>
{{ content }}
  </main>
  <footer><p><a href="https://github.com/eRgo35/notae">Notae on GitHub</a> · <a href="/privacy/">Privacy policy</a></p></footer>
</body>
</html>
