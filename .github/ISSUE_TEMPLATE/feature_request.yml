name: Feature request
description: Suggest an improvement or a new capability.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Notae is local-first: PDFs are never modified, and the Android app uses no network. Ideas that fit
        those principles are the easiest to accept. See the product scope in
        [the design spec](https://github.com/eRgo35/notae/blob/main/docs/superpowers/specs/2026-10-09-notae-design.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android app
        - Sidecar import
        - Documentation
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you do today and what is awkward about it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Notae to do?
      description: A rough description is fine. Sketches and screenshots help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or existing tools you use instead.
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with the project
      options:
        - label: This does not need network access, an account or telemetry.
        - label: This does not copy, move, rename or modify the user's PDFs.
