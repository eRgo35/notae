name: CI

on:
  # Branch work is covered by its pull request, so a push to a PR branch does not run twice.
  push:
    branches: [main]
  pull_request:
  # Reused as the quality gate of the release workflow; `ref` selects the commit under test.
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag or SHA) to check out; empty means the triggering ref.
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or PR supersedes the older run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    env:
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free preinstalled runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install native host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libtesseract-dev libleptonica-dev libfontconfig1-dev pkg-config tesseract-ocr-eng
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install pinned Cargo tools
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.9.1 cargo-llvm-cov
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::unwrap_used -A clippy::expect_used
      - name: Enforce production panic policy
        run: cargo clippy --workspace --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
      - name: Record free disk before tests (diagnostic)
        if: always()
        continue-on-error: true
        run: |
          df -h || true
          du -sh target 2>/dev/null || true
      - name: Run tests
        run: cargo test --workspace
      - name: Disk usage after cargo test (diagnostic)
        if: always()
        continue-on-error: true
        run: |
          df -h || true
          du -sh target target/debug target/debug/deps 2>/dev/null || true
          du -sh target/debug/deps/* 2>/dev/null | sort -rh | head -n 20 || true
      - name: Validate documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Audit dependencies
        run: cargo deny check
      - name: Enforce coverage floor
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 84
      - name: Smoke-test CLI interface
        run: cargo run -p notae-index-cli -- --help
      - name: Disk usage at end of job (diagnostic)
        if: always()
        continue-on-error: true
        run: |
          df -h || true
          du -sh target 2>/dev/null || true

  android-target:
    name: Android arm64 compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Android NDK r26d
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain and target
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android
      - name: Install pinned cargo-apk2
        run: cargo install --locked --version 1.4.0 cargo-apk2
      - name: Check Android target
        run: cargo apk2 check -p notae-android --target aarch64-linux-android
