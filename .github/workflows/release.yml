name: Release

# Cuts a signed Android release from a pushed `vX.Y.Z` tag (docs/android-release.md). It checks
# the tag, runs every CI gate on it, builds the release APK and AAB signed with the repository's
# release key, verifies the APK against the pinned certificate and attaches it to the GitHub
# Release with the notes in docs/release-notes/vX.Y.Z.md. Without the signing secrets it fails;
# it never falls back to the debug key.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  # Public SHA-256 fingerprint of the release signing certificate (not a secret). Changing the
  # release key means changing this value in a reviewed commit.
  NOTAE_RELEASE_CERT_SHA256: BE:27:CD:78:17:66:C5:C2:8A:9D:B1:06:C0:7B:05:1C:EE:E4:E0:00:31:05:96:45:95:E2:A8:48:F3:71:F6:01
  NDK_VERSION: 28.2.13676358

jobs:
  preflight:
    name: Check the tag, version, notes and secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check that the signing secrets are configured
        env:
          NOTAE_KEYSTORE_BASE64: ${{ secrets.NOTAE_KEYSTORE_BASE64 }}
          NOTAE_KEYSTORE_PASSWORD: ${{ secrets.NOTAE_KEYSTORE_PASSWORD }}
          NOTAE_KEY_ALIAS: ${{ secrets.NOTAE_KEY_ALIAS }}
          NOTAE_KEY_PASSWORD: ${{ secrets.NOTAE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in NOTAE_KEYSTORE_BASE64 NOTAE_KEYSTORE_PASSWORD NOTAE_KEY_ALIAS NOTAE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Add these repository Actions secrets, then delete and push the tag again: ${missing[*]} (docs/android-release.md)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag form, version, notes and branch
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          version=$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]") } in_pkg && /^version *=/ { gsub(/^version *= *"|"$/, ""); print; exit }' Cargo.toml)
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match the workspace version $version"; exit 1; }
          [ -f "docs/release-notes/$TAG.md" ] || { echo "::error::missing docs/release-notes/$TAG.md"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }

  gates:
    name: Quality gates
    needs: preflight
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, sign, verify and publish
    needs: [preflight, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Free preinstalled runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      # The build steps never see the write token: it is not left in .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned Rust toolchain, Android target and cargo-ndk
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install --locked --version 4.1.2 cargo-ndk
      - name: Install the Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
      - name: Write the release keystore
        env:
          NOTAE_KEYSTORE_BASE64: ${{ secrets.NOTAE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          keystore=$RUNNER_TEMP/notae-release.keystore
          printf '%s' "$NOTAE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "NOTAE_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Build the signed release APK and AAB
        working-directory: apps/notae-android
        env:
          NOTAE_KEYSTORE_PASSWORD: ${{ secrets.NOTAE_KEYSTORE_PASSWORD }}
          NOTAE_KEY_ALIAS: ${{ secrets.NOTAE_KEY_ALIAS }}
          NOTAE_KEY_PASSWORD: ${{ secrets.NOTAE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/notae-release.keystore"
      - name: Verify the APK and AAB
        run: |
          build_tools=$ANDROID_HOME/build-tools/36.0.0
          scripts/verify-release-apk.sh apps/notae-android/app/build/outputs/apk/release/app-release.apk \
            "$TAG" dist "$build_tools"
          # The bundle is jar-signed; its certificate must be the same release certificate.
          aab=apps/notae-android/app/build/outputs/bundle/release/app-release.aab
          actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          if [ "$actual" != "$NOTAE_RELEASE_CERT_SHA256" ]; then
            echo "::error::AAB signing certificate ${actual:-none} is not the release certificate"
            exit 1
          fi
          cp "$aab" "dist/notae-${TAG#v}.aab"
      - name: Keep the APK and AAB as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: notae-${{ env.TAG }}
          path: dist/*
          if-no-files-found: error
      - name: Publish the GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          gh release create "$TAG" --verify-tag --title "Notae $TAG" \
            --notes-file "docs/release-notes/$TAG.md" --generate-notes \
            "dist/notae-$version-arm64.apk" "dist/notae-$version-arm64.apk.sha256"
