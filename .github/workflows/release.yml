name: Release

# Cuts a signed Android release from a pushed `vX.Y.Z` tag (docs/android-release.md). It checks
# the tag and that CI already passed on the tagged commit (it does not run the gates again), builds
# the release APK and AAB signed with the repository's release key, verifies both against the
# pinned certificate and attaches the APK to the GitHub Release with the notes in
# docs/release-notes/vX.Y.Z.md. The AAB is kept as the workflow artifact `notae-vX.Y.Z` and, when
# the PLAY_SERVICE_ACCOUNT_JSON secret is set, uploaded to Google Play's internal testing track,
# where the same key is the upload key and Play re-signs installs with its own app signing key.
# Without the signing secrets it fails; it never falls back to the debug key. Run by hand with a
# tag, it only uploads that tag's AAB to Google Play, taken from the tag's successful release run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag (vX.Y.Z) whose AAB to upload to Google Play
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Public SHA-256 fingerprint of the release signing certificate (not a secret): it signs the
  # GitHub APK and is Google Play's upload key. Changing the release key means changing this value
  # in a reviewed commit.
  NOTAE_RELEASE_CERT_SHA256: BE:27:CD:78:17:66:C5:C2:8A:9D:B1:06:C0:7B:05:1C:EE:E4:E0:00:31:05:96:45:95:E2:A8:48:F3:71:F6:01
  NDK_VERSION: 28.2.13676358

jobs:
  preflight:
    name: Check the tag, version, notes, secrets and CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check that the signing secrets are configured
        env:
          NOTAE_KEYSTORE_BASE64: ${{ secrets.NOTAE_KEYSTORE_BASE64 }}
          NOTAE_KEYSTORE_PASSWORD: ${{ secrets.NOTAE_KEYSTORE_PASSWORD }}
          NOTAE_KEY_ALIAS: ${{ secrets.NOTAE_KEY_ALIAS }}
          NOTAE_KEY_PASSWORD: ${{ secrets.NOTAE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in NOTAE_KEYSTORE_BASE64 NOTAE_KEYSTORE_PASSWORD NOTAE_KEY_ALIAS NOTAE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Add these repository Actions secrets, then delete and push the tag again: ${missing[*]} (docs/android-release.md)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag form, version, notes and branch
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          version=$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]") } in_pkg && /^version *=/ { gsub(/^version *= *"|"$/, ""); print; exit }' Cargo.toml)
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match the workspace version $version"; exit 1; }
          [ -f "docs/release-notes/$TAG.md" ] || { echo "::error::missing docs/release-notes/$TAG.md"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
      - name: Check that CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --limit 1 --json databaseId --jq length)
          [ "$passed" = 1 ] || { echo "::error::CI has not passed on $GITHUB_SHA; let it pass on main (or run it with gh workflow run ci.yml), then delete and push the tag again"; exit 1; }

  release:
    name: Build, sign, verify and publish
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Free preinstalled runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      # The build steps never see the write token: it is not left in .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned Rust toolchain, Android target and cargo-ndk
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install --locked --version 4.1.2 cargo-ndk
      - name: Install the Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;36.0.0" "ndk;$NDK_VERSION"
      - name: Write the release keystore
        env:
          NOTAE_KEYSTORE_BASE64: ${{ secrets.NOTAE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          keystore=$RUNNER_TEMP/notae-release.keystore
          printf '%s' "$NOTAE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "NOTAE_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Build the signed release APK and AAB
        working-directory: apps/notae-android
        env:
          NOTAE_KEYSTORE_PASSWORD: ${{ secrets.NOTAE_KEYSTORE_PASSWORD }}
          NOTAE_KEY_ALIAS: ${{ secrets.NOTAE_KEY_ALIAS }}
          NOTAE_KEY_PASSWORD: ${{ secrets.NOTAE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/notae-release.keystore"
      - name: Verify the APK and AAB
        run: |
          build_tools=$ANDROID_HOME/build-tools/36.0.0
          scripts/verify-release-apk.sh apps/notae-android/app/build/outputs/apk/release/app-release.apk \
            "$TAG" dist "$build_tools"
          # The bundle is jar-signed; its certificate must be the same release certificate.
          aab=apps/notae-android/app/build/outputs/bundle/release/app-release.aab
          actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          if [ "$actual" != "$NOTAE_RELEASE_CERT_SHA256" ]; then
            echo "::error::AAB signing certificate ${actual:-none} is not the release certificate"
            exit 1
          fi
          cp "$aab" "dist/notae-${TAG#v}.aab"
      - name: Keep the APK and AAB as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: notae-${{ env.TAG }}
          path: dist/*
          if-no-files-found: error
      - name: Publish the GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          gh release create "$TAG" --verify-tag --title "Notae $TAG" \
            --notes-file "docs/release-notes/$TAG.md" --generate-notes \
            "dist/notae-$version-arm64.apk" "dist/notae-$version-arm64.apk.sha256"

  # Uploads the verified AAB to a Google Play track with plain curl calls to the Play Developer
  # API, authenticated by a service account (docs/android-release.md). It is a separate job, so the
  # build never sees the Play key and a failed upload can be re-run alone. Without the secret it
  # only leaves a notice, and the AAB is uploaded by hand as before.
  play:
    name: Upload the AAB to Google Play
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
    env:
      PLAY_PACKAGE: com.c2yz.notae
      PLAY_TRACK: internal
      # `completed` rolls the release out to the track's testers; `draft` leaves it for Play Console
      # (the only status Play accepts while the app itself is still a draft).
      PLAY_RELEASE_STATUS: completed
    steps:
      - name: Check that the Play secret is configured
        id: secret
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so the AAB was not uploaded to Google Play; upload it by hand (docs/android-release.md)."
          fi
      # Run by hand, the AAB comes from the tag's own release run, which passed every check.
      - name: Find the tag's release run
        id: run
        if: steps.secret.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$TAG" --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$id" ] || { echo "::error::no successful release run for $TAG"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.secret.outputs.configured == 'true'
        with:
          name: notae-${{ env.TAG }}
          path: dist
          run-id: ${{ steps.run.outputs.id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Upload the AAB and roll it out on the track
        if: steps.secret.outputs.configured == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          aab=dist/notae-$version.aab
          [ -f "$aab" ] || { echo "::error::missing $aab"; exit 1; }

          # OAuth access token from a JWT signed with the service account key.
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          umask 077
          key=$RUNNER_TEMP/play-key.pem
          trap 'rm -f "$key"' EXIT
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | jq -r .private_key > "$key"
          email=$(printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | jq -r .client_email)
          now=$(date +%s)
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          claims=$(jq -cjn --arg iss "$email" --argjson iat "$now" \
            '{iss: $iss, scope: "https://www.googleapis.com/auth/androidpublisher",
              aud: "https://oauth2.googleapis.com/token", iat: $iat, exp: ($iat + 600)}' | b64url)
          signature=$(printf '%s.%s' "$header" "$claims" | openssl dgst -sha256 -sign "$key" -binary | b64url)
          rm -f "$key"
          token=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            --data-urlencode "assertion=$header.$claims.$signature" | jq -r .access_token)
          echo "::add-mask::$token"

          api=https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PLAY_PACKAGE
          call() { curl -sS --fail-with-body -H "Authorization: Bearer $token" "$@"; }

          # An edit is Play's transaction: nothing is visible until it is committed.
          edit=$(call -X POST "$api/edits" | jq -r .id)
          version_code=$(call -X POST -H 'Content-Type: application/octet-stream' --data-binary "@$aab" \
            "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PLAY_PACKAGE/edits/$edit/bundles?uploadType=media" \
            | jq -r .versionCode)
          jq -n --arg track "$PLAY_TRACK" --arg name "$version" --arg code "$version_code" --arg status "$PLAY_RELEASE_STATUS" \
            '{track: $track, releases: [{name: $name, versionCodes: [$code], status: $status}]}' \
            | call -X PUT -H 'Content-Type: application/json' --data-binary @- "$api/edits/$edit/tracks/$PLAY_TRACK" > /dev/null
          call -X POST "$api/edits/$edit:commit" > /dev/null
          echo "::notice::Notae $version (version code $version_code) is on the Google Play $PLAY_TRACK track as $PLAY_RELEASE_STATUS."
