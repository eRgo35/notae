# Publishes the project site (https://notae.c2yz.com): README.md as the home page and PRIVACY.md at /privacy/.
# Only those two files and the README's images are published; links to other repository files point at GitHub.
# scripts/pages-site.sh assembles the site with the layout in .github/pages/.
name: Pages

on:
  push:
    branches: [main]
    paths: [README.md, PRIVACY.md, docs/images/**, .github/pages/**, scripts/pages-site.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: scripts/pages-site.sh site
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
