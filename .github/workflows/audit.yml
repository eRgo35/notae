name: Dependency audit

# New RustSec advisories appear without any code change, so audit on a schedule as well. This
# workflow is separate from CI: a failure here reports the advisory to the
# maintainers but never blocks a commit, a pull request or a release.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  advisories:
    name: cargo deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      # The prebuilt release binary, checked against its published SHA-256, instead of a
      # several-minute `cargo install`.
      - name: Install pinned cargo-deny
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: cargo-deny-0.20.2-x86_64-unknown-linux-musl
        run: |
          gh release download 0.20.2 --repo EmbarkStudios/cargo-deny --pattern "$NAME.tar.gz*"
          echo "$(cut -d' ' -f1 "$NAME.tar.gz.sha256")  $NAME.tar.gz" | sha256sum --check
          tar -xzf "$NAME.tar.gz"
          mkdir -p ~/.cargo/bin
          mv "$NAME/cargo-deny" ~/.cargo/bin/
      - name: Check advisories
        run: cargo deny check advisories
