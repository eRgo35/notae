[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android"]
[advisories]
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is an unmaintained-notice build-time dependency of the UniFFI binding generator (askama_derive via uniffi_bindgen, only with the bindgen-cli feature); it never ships in the app; cargo-deny reports no safe upgrade." },
]
[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
allow-wildcard-paths = true
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
