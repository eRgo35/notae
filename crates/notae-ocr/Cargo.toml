[package]
name = "notae-ocr"
description = "Local multilingual OCR provider for Notae, backed by Tesseract."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "notae_ocr"
path = "src/lib.rs"

[dependencies]
image = "0.25"
notae-domain = { path = "../notae-domain", version = "0.3.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tesseract = "0.15.2"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true